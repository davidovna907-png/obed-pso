<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Обед ПСО</title>
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --text: #2b2b2b; --muted: #6b6b6b;
    --accent: #c0392b; --line: #e3ddd4; --ok: #2e7d32;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { background: var(--accent); color: #fff; padding: 16px; text-align: center; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; opacity: .9; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 140px; }
  .notice { background: #fff3cd; border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: .95rem; }
  .notice.closed { background: #fdecea; color: var(--accent); font-weight: 600; }
  section { background: var(--card); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  section h2 { margin: 0 0 8px; font-size: 1.15rem; }
  section h2 small { color: var(--muted); font-weight: 400; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .info { flex: 1; }
  .name { font-weight: 600; }
  .desc { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .price { white-space: nowrap; font-weight: 600; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
                background: #fff; font-size: 1.1rem; cursor: pointer; }
  .qty span { min-width: 20px; text-align: center; }
  .order { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
           box-shadow: 0 -2px 10px rgba(0,0,0,.1); padding: 12px 16px; }
  .order-inner { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .order input { flex: 1 1 180px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; }
  .total { font-weight: 700; }
  .send { background: var(--ok); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px;
          font-size: 1rem; cursor: pointer; }
  .send:disabled { background: #9e9e9e; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Обед ПСО</h1>
  <p id="menu-date"></p>
</header>

<main>
  <div class="notice" id="deadline">Заказы принимаются до 21:00.</div>
  <div id="menu"></div>
</main>

<div class="order">
  <div class="order-inner">
    <input id="name" placeholder="Ваше имя" autocomplete="name">
    <span class="total">Итого: <span id="total">0</span> ₽</span>
    <button class="send" id="send">Отправить заказ</button>
  </div>
</div>

<script>
// ===== МЕНЮ НА ЗАВТРА (заменяется целиком при обновлении по фото) =====
const MENU_DATE = "Среда, 30.09.2026";
const MENU = [
  { title: "Супы", note: "~330 мл", items: [
    { name: "Гороховый с копчёностями", price: 140 },
    { name: "Уха с горбушей", price: 150 },
    { name: "Сухарики", price: 15 },
  ]},
  { title: "Горячие блюда", note: "~300 г", items: [
    { name: "Котлета фаршированная сыром с картофельным пюре и итальянским соусом", price: 230 },
    { name: "Люля-кебаб на углях с макаронами и грибным соусом", price: 230 },
    { name: "Говядина по-азиатски с китайским рисом", price: 260 },
    { name: "Мясное азу с гречкой", price: 230 },
    { name: "Куриный стейк на углях со сложным гарниром (запечённый картофель и лобио)", price: 230 },
  ]},
  { title: "Салаты", note: "~135–145 г", items: [
    { name: "Свекольный", price: 120, desc: "Свекла, чернослив, грецкий орех, сметана, майонез, чеснок" },
    { name: "Баба Надя", price: 140, desc: "Курица запечённая, овощи запечённые (цукини, баклажан, перец болгарский, картофель), яйцо, майонез, петрушка" },
    { name: "Фунчоза", price: 140, desc: "Фунчоза, помидор, огурец свежий, перец болгарский, курица копчёная, заправка" },
  ]},
  { title: "Премиум блюда", items: [
    { name: "Минтай в сухарях панко с картофельным пюре и соусом огуречный релиш", price: 400 },
    { name: "Боул с курицей терияки", price: 400, desc: "Авокадо, куриное филе, рис китайский, кукуруза консервированная, терияки соус, перец болгарский, огурец, жареный лук фри" },
  ]},
  { title: "Напитки", note: "~330 мл", items: [
    { name: "Морс из брусники", price: 90 },
  ]},
  { title: "Завтрак", items: [
    { name: "Каша 5 злаков с джемом", price: 140 },
  ]},
  { title: "Выпечка", items: [
    { name: "Блины с жюльеном и сыром (2 шт)", price: 150 },
    { name: "Блины с творогом и сметанным кремом (2 шт)", price: 130 },
    { name: "Блины с ветчиной и сыром (2 шт)", price: 130 },
    { name: "Трайфл с клубничным кремом и грецким орехом", price: 150 },
    { name: "Манник с грецким орехом со сгущённым молоком", price: 130 },
    { name: "Запеканка ванильная с яблоком и корицей со сгущённым молоком", price: 130 },
    { name: "Пирожок с картошкой", price: 70 },
    { name: "Пирожок с яйцом и луком", price: 80 },
    { name: "Беляш", price: 80 },
    { name: "Сосиска в тесте", price: 80 },
    { name: "Курник", price: 90 },
  ]},
];
// ===== КОНЕЦ МЕНЮ =====

const DEADLINE_HOUR = 21; // приём заказов до 21:00
const cart = {};

function isOpen() { return new Date().getHours() < DEADLINE_HOUR; }

function render() {
  document.getElementById("menu-date").textContent = "Меню на " + MENU_DATE;
  const root = document.getElementById("menu");
  root.innerHTML = "";
  MENU.forEach((sec, si) => {
    const s = document.createElement("section");
    s.innerHTML = `<h2>${sec.title} ${sec.note ? `<small>${sec.note}</small>` : ""}</h2>`;
    sec.items.forEach((it, ii) => {
      const id = si + "-" + ii;
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="info">
          <div class="name">${it.name}</div>
          ${it.desc ? `<div class="desc">${it.desc}</div>` : ""}
        </div>
        <div class="price">${it.price != null ? it.price + " ₽" : "уточнить"}</div>
        <div class="qty">
          <button data-id="${id}" data-d="-1" aria-label="Убрать">−</button>
          <span id="q-${id}">0</span>
          <button data-id="${id}" data-d="1" aria-label="Добавить">+</button>
        </div>`;
      s.appendChild(row);
    });
    root.appendChild(s);
  });
}

function findItem(id) { const [s, i] = id.split("-").map(Number); return MENU[s].items[i]; }

function update() {
  let total = 0;
  for (const id in cart) total += (findItem(id).price || 0) * cart[id];
  document.getElementById("total").textContent = total;
  const open = isOpen();
  const dl = document.getElementById("deadline");
  dl.textContent = open ? "Заказы принимаются до 21:00." : "Приём заказов на завтра закрыт (после 21:00).";
  dl.classList.toggle("closed", !open);
  document.getElementById("send").disabled = !open;
}

document.getElementById("menu").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  const id = b.dataset.id;
  cart[id] = Math.max(0, (cart[id] || 0) + Number(b.dataset.d));
  if (!cart[id]) delete cart[id];
  document.getElementById("q-" + id).textContent = cart[id] || 0;
  update();
});

document.getElementById("send").addEventListener("click", async () => {
  if (!isOpen()) { alert("Приём заказов закрыт в 21:00."); return; }
  const name = document.getElementById("name").value.trim();
  if (!name) { alert("Укажите имя."); return; }
  const ids = Object.keys(cart);
  if (!ids.length) { alert("Выберите хотя бы одно блюдо."); return; }
  let total = 0;
  const lines = ids.map(id => {
    const it = findItem(id); const sum = (it.price || 0) * cart[id]; total += sum;
    return `• ${it.name} × ${cart[id]} = ${sum} ₽`;
  });
  const text = `Заказ «Обед ПСО» на ${MENU_DATE}\n${name}\n${lines.join("\n")}\nИтого: ${total} ₽`;
  try {
    if (navigator.share) { await navigator.share({ title: "Заказ «Обед ПСО»", text }); return; }
    await navigator.clipboard.writeText(text);
    alert("Заказ скопирован — вставьте его в чат:\n\n" + text);
  } catch (err) {
    if (err && err.name === "AbortError") return;
    prompt("Скопируйте заказ:", text);
  }
});

render();
update();
setInterval(update, 60000);
</script>
</body>
</html>
