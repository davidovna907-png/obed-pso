<body>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  /* Layout: one phone-first column (max 720px) on deep ink; every lesson carries its own color; der / die / das / plural colors are the memory system */
  --bg:#0d1020;
  --s1:#151a2e;
  --s2:#1e2341;
  --line:#2a3156;
  --fg:#eef0fb;
  --mut:#a6acd0;
  --dim:#767ca3;
  --gold:#f6c343;
  --der:#5aa9ff;
  --die:#ff6b8e;
  --das:#3fd48b;
  --pl:#f5b544;
  --ok:#3fd48b;
  --bad:#ff6b6b;
  --ink:#14121c;
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg);
  background:radial-gradient(900px 520px at 105% -8%, rgba(90,169,255,.13), transparent 62%),
             radial-gradient(760px 480px at -12% 4%, rgba(255,107,142,.10), transparent 60%),
             var(--bg);
  background-attachment:fixed;
  color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 56px}

/* brand */
.logo{display:flex;align-items:center;gap:12px;padding-block:4px 18px}
.flag{display:grid;grid-template-rows:repeat(3,1fr);width:30px;height:20px;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px var(--line);flex:none}
.flag i:nth-child(1){background:#000}
.flag i:nth-child(2){background:#dd0000}
.flag i:nth-child(3){background:#ffce00}
.logo b{display:block;font-family:var(--f-display);font-weight:700;font-size:1.02rem;letter-spacing:-.01em;line-height:1.2}
.logo small{display:block;color:var(--mut);font-size:.82rem}

/* today */
.today{display:grid;gap:14px;padding:18px;border-radius:26px;
  background:var(--s1);
  background:radial-gradient(130% 120% at 100% 0%, color-mix(in srgb,var(--c) 36%,transparent), transparent 58%), var(--s1);
  border:1px solid var(--line);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.today-meta,.lmeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem;color:var(--mut)}
.pill{background:var(--c);color:var(--ink);font-weight:700;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.donechip{color:var(--ok);font-weight:700}
.today-main,.ltitle{display:flex;gap:16px;align-items:center}
.big{font-family:var(--f-emoji);font-size:56px;line-height:1;width:84px;height:84px;display:grid;place-items:center;border-radius:22px;flex:none;
  background:var(--s2);background:color-mix(in srgb,var(--c) 24%,var(--s2))}
.tm{min-width:0}
.today h1,.ltitle h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.45rem,6.4vw,2.1rem);line-height:1.12;margin:0;letter-spacing:-.01em}
.de{display:flex;align-items:center;gap:10px;margin:6px 0 0;color:var(--c);font-weight:600;font-size:1.05rem}
.today-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:.88rem}
.go{background:var(--c);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:14px;font-size:.95rem}

/* progress + legend */
.prow{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-block:16px 12px}
.pwrap{flex:1 1 200px;display:grid;gap:6px}
.plabel{display:flex;justify-content:space-between;font-size:.86rem;color:var(--mut);font-variant-numeric:tabular-nums}
.plabel b{color:var(--fg)}
.pbar{height:10px;border-radius:99px;background:var(--s2);overflow:hidden}
.pbar i{display:block;height:100%;min-width:4px;border-radius:inherit;background:linear-gradient(90deg,var(--der),var(--das) 55%,var(--gold))}
.hardlink{display:inline-flex;gap:8px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:.92rem}
.hardlink b{color:var(--gold);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:.88rem;color:var(--mut)}
.legend > b{color:var(--fg);flex-basis:100%;font-weight:600}
.chip{font-weight:700;padding:2px 9px;border-radius:8px;font-size:.88rem}
.a-der{color:var(--der)}.a-die{color:var(--die)}.a-das{color:var(--das)}.a-pl{color:var(--pl)}
.chip.a-der,.art.a-der{background:rgba(90,169,255,.18)}
.chip.a-die,.art.a-die{background:rgba(255,107,142,.18)}
.chip.a-das,.art.a-das{background:rgba(63,212,139,.18)}
.chip.a-pl,.art.a-pl{background:rgba(245,181,68,.18)}

/* grid */
.h2{font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin:28px 0 4px;letter-spacing:-.01em}
.h2sub{color:var(--mut);font-size:.88rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.tile{position:relative;display:grid;gap:1px;align-content:start;padding:12px;border-radius:18px;min-width:0;
  background:var(--s1);background:color-mix(in srgb,var(--c) 13%,var(--s1));
  border:1px solid var(--line);border-color:color-mix(in srgb,var(--c) 30%,var(--line));transition:transform .15s}
.tile:active{transform:scale(.98)}
.tnum{font-family:var(--f-display);font-weight:700;font-size:.78rem;color:var(--c);font-variant-numeric:tabular-nums}
.temoji{font-family:var(--f-emoji);font-size:34px;line-height:1.2;margin-block:4px 2px}
.tt{font-weight:700;font-size:.98rem;line-height:1.2}
.tde{font-size:.8rem;color:var(--mut);overflow-wrap:anywhere}
.tdate{font-size:.76rem;color:var(--dim);margin-top:4px}
.tdate.now{color:var(--gold);font-weight:700}
.tile.future{opacity:.6}
.tile.is-today{box-shadow:0 0 0 2px var(--gold)}
.badge{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--bg);font-weight:800;font-size:.78rem}
.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:.86rem;display:grid;gap:6px}
.foot p{margin:0}

/* lesson */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:.92rem;padding-block:4px 10px}
.lhead{padding:16px;border-radius:24px;display:grid;gap:12px;
  background:var(--s1);background:radial-gradient(120% 120% at 100% 0%, color-mix(in srgb,var(--c) 30%,transparent), transparent 60%), var(--s1);
  border:1px solid var(--line);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.lnote{margin:0;color:var(--mut);font-size:.92rem;max-width:62ch}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin-inline:-16px;padding-inline:16px;padding-block:12px;background:linear-gradient(var(--bg) 78%, transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--s1);padding:9px 15px;border-radius:12px;font-weight:600;font-size:.94rem;color:var(--mut)}
.tab[aria-selected="true"]{background:var(--c);border-color:transparent;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--s1);font-weight:600;font-size:.95rem;text-align:center}
.btn.pri{background:var(--c,var(--gold));border-color:transparent;color:var(--ink)}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.btn.wide{width:100%}

.words,.list{display:grid;gap:10px}
.word{--g:var(--c);display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);transition:border-color .2s,background-color .2s}
.word.speaking{border-color:var(--g);background:var(--s2)}
.pic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-emoji);font-size:36px;line-height:1;
  background:var(--s2);background:color-mix(in srgb,var(--g) 22%,var(--s2));
  box-shadow:inset 0 0 0 2px var(--line);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--g) 60%,transparent)}
.wb{min-width:0;display:grid;gap:1px}
.wde{font-size:1.16rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.art{font-size:.8em;font-weight:700;padding:1px 7px;border-radius:7px;margin-right:2px}
.wtr{color:var(--mut);font-size:.93rem;overflow-wrap:anywhere}
.wtr b{color:var(--gold);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.wtr .br{color:var(--dim)}
.wru{font-size:1rem}
.wpl,.wref{font-size:.82rem;color:var(--dim)}
.wact{display:flex;flex-direction:column;gap:6px;align-items:center}
.say{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:none;background:var(--g,var(--c));color:var(--ink);flex:none}
.say svg{width:20px;height:20px}
.say.sm{width:34px;height:34px}
.say.sm svg{width:16px;height:16px}
.say.on{animation:pulse .5s}
.star{width:44px;height:36px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:1.15rem;line-height:1}
.star[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.sub{margin:22px 0 10px;font-size:1rem}
.sub a{display:inline-flex;gap:8px;align-items:baseline;color:var(--c);font-weight:700}
.sub .se{font-family:var(--f-emoji)}
.subde{color:var(--mut);font-weight:500;font-size:.88rem}

.phr,.ex{--g:var(--c);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.phr{padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}
.pb,.exb{min-width:0;display:grid;gap:2px}
.pde{font-weight:700;font-size:1.1rem;line-height:1.3}

.rules{display:grid;gap:12px}
.rule{padding:16px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line);display:grid;gap:8px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.rule h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.3}
.rule p{margin:0;color:var(--mut);max-width:62ch}
.exs{display:grid;gap:8px;margin-top:4px}
.ex{padding:10px 12px;border-radius:14px;background:var(--s2)}
.exde{font-weight:700}

.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 14px;align-items:center;text-align:left;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid var(--line)}
.mi{grid-row:span 2;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.95rem;color:var(--c);
  background:var(--s2);background:color-mix(in srgb,var(--c) 20%,var(--s2))}
.mt{font-weight:700;font-size:1.05rem}
.md{color:var(--mut);font-size:.9rem}
.best{color:var(--mut);font-size:.9rem;margin:12px 0 0}
.best b{color:var(--fg)}

/* trainer */
.trainer{display:grid;gap:14px}
.tprog{display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--mut);font-variant-numeric:tabular-nums}
.tprog .pbar{flex:1;height:8px}
.link{background:none;border:none;color:var(--mut);font-weight:600;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.qcard{--g:var(--c);padding:22px 16px;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:grid;justify-items:center;gap:8px;text-align:center;animation:rise .25s ease-out}
.qpic{font-family:var(--f-emoji);font-size:72px;line-height:1.1}
.qword{font-size:clamp(1.4rem,7vw,2rem);font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.qhint{color:var(--mut);font-size:.92rem}
.qru{font-size:1.2rem;font-weight:600}
.reveal{display:grid;gap:4px;justify-items:center}
.opts{display:grid;gap:8px}
.opt{min-height:54px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--s1);text-align:left;font-size:1.03rem;font-weight:600}
.opt.ok{border-color:var(--ok);background:rgba(63,212,139,.18)}
.opt.bad{border-color:var(--bad);background:rgba(255,107,107,.18)}
.opt:disabled,.artbtn:disabled{cursor:default}
.arts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.artbtn{min-height:66px;border-radius:18px;border:2px solid currentColor;background:var(--s1);font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.artbtn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.artbtn.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.result{display:grid;justify-items:center;gap:10px;text-align:center;padding:22px 16px;border-radius:24px;background:var(--s1);border:1px solid var(--line)}
.ring{width:140px;height:140px}
.result h3{font-family:var(--f-display);font-size:1.35rem;margin:0}
.result p{margin:0;color:var(--mut)}
.okline{color:var(--ok)!important;font-weight:700}
.rbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.empty{padding:22px 16px;border-radius:var(--r);background:var(--s1);border:1px dashed var(--line);display:grid;gap:10px;justify-items:start}
.empty p{margin:0;color:var(--mut)}
.empty b{color:var(--fg)}
.h3{font-size:1rem;margin:22px 0 10px}
.lfoot{display:grid;gap:10px;margin-top:22px}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.navrow .btn{flex:1 1 140px}

@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes rise{from{transform:translateY(6px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){
  .word{grid-template-columns:54px minmax(0,1fr) auto;gap:10px}
  .pic{width:54px;height:54px;font-size:30px}
  .big{width:72px;height:72px;font-size:46px}
}
</style>

<script>

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pl(n, a, b, c){ var m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function wordsOf(l){
  if (!l) return [];
  if (l.r) return l.r.reduce(function(acc, d){ return acc.concat(wordsOf(BY[d])); }, []);
  return l.w.map(function(w, i){ return { k: l.d + '-' + i, d: l.d, pic: w[0], de: w[1], pl: w[2], tr: w[3], ru: w[4] }; });
}
var ALL = LESSONS.filter(function(l){ return !l.r; }).reduce(function(acc, l){ return acc.concat(wordsOf(l)); }, []);

function gender(w){ if (w.pl === 'мн.ч.') return 'pl'; var m = /^(der|die|das) /.exec(w.de); return m ? m[1] : null; }
function isNoun(w){ var g = gender(w); return g === 'der' || g === 'die' || g === 'das'; }
function stripArt(de){ return de.replace(/^(der|die|das) /, ''); }

/* ---------- progress ---------- */
var LS_KEY = 'djt-progress-v1', LS_SLOW = 'djt-slow';
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
var S = { done: {}, best: {}, hard: [], updated: '' };
try {
  var raw = lsGet(LS_KEY);
  if (raw){ var o = JSON.parse(raw); if (o && typeof o === 'object'){ S.done = o.done || {}; S.best = o.best || {}; S.hard = Array.isArray(o.hard) ? o.hard.filter(function(k){ return WK[k]; }) : []; S.updated = o.updated || ''; } }
} catch(e){}
var slow = lsGet(LS_SLOW) === '1';
function save(){ S.updated = new Date().toISOString(); lsSet(LS_KEY, JSON.stringify(S)); pushRemote(); }
function isHard(k){ return S.hard.indexOf(k) !== -1; }
function setHard(k, on){ var has = isHard(k); if (on && !has) S.hard.push(k); else if (!on && has) S.hard = S.hard.filter(function(x){ return x !== k; }); else return; save(); }

/* cloud sync through the artifact store (falls back to this device only) */
var ref = null, chain = Promise.resolve(), pushT = null, cloud = false;
function pushRemote(){
  if (!ref) return;
  clearTimeout(pushT);
  pushT = setTimeout(function(){
    var body = { done: Object.assign({}, S.done), best: Object.assign({}, S.best), hard: S.hard.slice(), updated: S.updated || new Date().toISOString() };
    chain = chain.then(function(){ return ref.set(body); }).catch(function(){});
  }, 800);
}
function initCloud(){
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  c.use('db').then(function(db){
    if (!db) return;
    var r = db.doc('progress/main');
    return r.get().then(function(snap){
      ref = r; cloud = true;
      if (snap.exists){
        var o = snap.data() || {};
        var remoteNewer = (o.updated || '') > (S.updated || '');
        var done = Object.assign({}, o.done || {}, S.done);
        var best = Object.assign({}, o.best || {});
        Object.keys(S.best).forEach(function(k){ best[k] = Math.max(best[k] || 0, S.best[k]); });
        var grew = Object.keys(done).length !== Object.keys(o.done || {}).length;
        S.done = done; S.best = best;
        if (remoteNewer){ S.hard = (Array.isArray(o.hard) ? o.hard : []).filter(function(k){ return WK[k]; }); S.updated = o.updated; }
        lsSet(LS_KEY, JSON.stringify(S));
        if (!remoteNewer || grew) pushRemote();
      } else if (Object.keys(S.done).length || S.hard.length || Object.keys(S.best).length){
        pushRemote();
      }
      if (route().name === 'home' || (route().name === 'hard' && !T)) render();
    });
  }).catch(function(){ ref = null; cloud = false; });
}

/* ---------- speech ---------- */
var CAN = ('speechSynthesis' in window) && typeof window.SpeechSynthesisUtterance !== 'undefined';
var deVoice = null, voicesSeen = false;
function pickVoice(){
  try {
    var vs = window.speechSynthesis.getVoices() || [];
    if (vs.length) voicesSeen = true;
    deVoice = vs.filter(function(v){ return /^de[-_]DE/i.test(v.lang); })[0] || vs.filter(function(v){ return /^de/i.test(v.lang); })[0] || null;
  } catch(e){}
}
if (CAN){ pickVoice(); try { window.speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){ window.speechSynthesis.onvoiceschanged = pickVoice; } }
function clean(t){ return String(t).replace(/→/g, ', ').replace(/…/g, ' ').replace(/\s+/g, ' ').trim(); }
function utter(t){ var u = new SpeechSynthesisUtterance(clean(t)); u.lang = 'de-DE'; if (deVoice) u.voice = deVoice; u.rate = slow ? 0.6 : 0.88; return u; }
function say(t){ if (!CAN) return; try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(utter(t)); } catch(e){} }
var playing = false;
function playLabel(on){ return on ? '■ Стоп' : '▶ Слушать все слова'; }
function stopAll(){
  playing = false;
  if (CAN) { try { window.speechSynthesis.cancel(); } catch(e){} }
  var rows = document.querySelectorAll('.word.speaking'); for (var i = 0; i < rows.length; i++) rows[i].classList.remove('speaking');
  var b = document.querySelector('[data-act="playall"]'); if (b) b.textContent = playLabel(false);
}
function playAll(btn){
  if (!CAN) return;
  if (playing){ stopAll(); return; }
  var rows = Array.prototype.slice.call(document.querySelectorAll('.word[data-de]'));
  if (!rows.length) return;
  try { window.speechSynthesis.cancel(); } catch(e){}
  playing = true; btn.textContent = playLabel(true);
  var i = 0;
  function step(){
    rows.forEach(function(r){ r.classList.remove('speaking'); });
    if (!playing || i >= rows.length){ stopAll(); return; }
    var row = rows[i]; row.classList.add('speaking');
    try { row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch(e){}
    var u = utter(row.getAttribute('data-de')), fired = false;
    var fin = function(){ if (fired) return; fired = true; i++; setTimeout(step, 450); };
    u.onend = fin; u.onerror = fin;
    try { window.speechSynthesis.speak(u); } catch(e){ fin(); }
  }
  step();
}
var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.2 5.8a8.6 8.6 0 0 1 0 12.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function gtUrl(t){ return 'https://translate.google.com/?sl=de&tl=ru&op=translate&text=' + encodeURIComponent(clean(t)); }
function sayBtn(t, sm){

/* ---------- training ---------- */
var CAP = { lesson: { cards: 99, test: 99, art: 99 }, review: { cards: 20, test: 15, art: 15 }, hard: { cards: 30, test: 15, art: 15 } };
function ctxOf(){ if (curD === 'hard') return 'hard'; return BY[curD].r ? 'review' : 'lesson'; }
function poolNow(){ if (curD === 'hard') return S.hard.map(function(k){ return WK[k]; }).filter(Boolean); return wordsOf(BY[curD]); }
function sizeFor(mode, pool){ var p = mode === 'art' ? pool.filter(isNoun) : pool; return Math.min(p.length, CAP[ctxOf()][mode]); }
function deckFor(mode){ var p = poolNow(); if (mode === 'art') p = p.filter(isNoun); return shuffle(p).slice(0, CAP[ctxOf()][mode]); }
function modeBtn(mode, icon, title, desc){ return '<button type="button" class="mode" data-act="start" data-mode="' + mode + '"><span class="mi" aria-hidden="true">' + icon + '</span><span class="mt">' + title + '</span><span class="md">' + desc + '</span></button>'; }
function trainMenuHTML(pool, l){
  var nC = sizeFor('cards', pool), nT = sizeFor('test', pool), nA = sizeFor('art', pool);
  var h = '<div class="modes">' +
    modeBtn('cards', '⇄', 'Карточки', 'Смотрите на слово и вспоминайте перевод · ' + nC + ' ' + pl(nC, 'карточка', 'карточки', 'карточек')) +
    modeBtn('test', '4×', 'Тест', 'Выберите верный перевод из четырёх · ' + nT + ' ' + pl(nT, 'вопрос', 'вопроса', 'вопросов'));
  if (nA >= 2) h += modeBtn('art', 'der', 'Der, die или das?', 'Угадайте род существительного · ' + nA + ' ' + pl(nA, 'слово', 'слова', 'слов'));
  h += '</div>';
  if (l && S.best[l.d] != null) h += '<p class="best">Лучший результат в тестах: <b>' + S.best[l.d] + '%</b></p>';
  return h;
}
function makeQ(mode, w, i){
  if (mode === 'cards') return { w: w };
  if (mode === 'art') return { w: w, opts: ['der','die','das'], c: ['der','die','das'].indexOf(gender(w)) };
  var dir = i % 2 === 0 ? 'de' : 'ru', key = dir === 'de' ? 'ru' : 'de';
  var cands = shuffle(poolNow().filter(function(x){ return x.k !== w.k && x[key] !== w[key]; }));
  if (cands.length < 6) cands = cands.concat(shuffle(ALL.filter(function(x){ return x.k !== w.k && x[key] !== w[key]; })));
  var seen = {}; seen[w[key]] = 1; var ds = [];
  for (var j = 0; j < cands.length && ds.length < 3; j++){ var v = cands[j][key]; if (!seen[v]){ seen[v] = 1; ds.push(v); } }
  var opts = shuffle([w[key]].concat(ds));
  return { w: w, dir: dir, opts: opts, c: opts.indexOf(w[key]) };
}
function startTrainer(mode, deck){
  if (!deck.length) return;
  stopAll();
  T = { mode: mode, qs: deck.map(function(w, i){ return makeQ(mode, w, i); }), i: 0, right: 0, wrong: [], picked: null, revealed: false, finished: false, origin: curD };
  paintBody(); keepTabsInView();
}
function nextQ(){
  if (!T) return;
  clearTimeout(T.timer);
  T.i++; T.picked = null; T.revealed = false;
  if (T.i >= T.qs.length) finish();
  paintBody();
}
function finish(){
  T.finished = true;
  T.pct = Math.round(T.right / T.qs.length * 100);
  if (typeof T.origin === 'number' && T.mode !== 'cards'){
    S.best[T.origin] = Math.max(S.best[T.origin] || 0, T.pct);
    if (T.pct >= 70) S.done[T.origin] = true;
    save();
  }
}
function answer(i){
  if (!T || T.picked != null || T.finished) return;
  var q = T.qs[T.i]; T.picked = i;
  var ok = i === q.c;
  if (ok){ T.right++; if (T.origin === 'hard') setHard(q.w.k, false); }
  else { T.wrong.push(q.w); setHard(q.w.k, true); }
  say(q.w.de);
  paintBody();
  if (ok){ var tok = T; T.timer = setTimeout(function(){ if (T === tok) nextQ(); }, 1200); }
}
function cardAnswer(know){
  var w = T.qs[T.i].w;
  if (know){ T.right++; setHard(w.k, false); } else { T.wrong.push(w); setHard(w.k, true); }
  nextQ();
}
function nextBtn(){ return '<button type="button" class="btn pri wide" data-act="next">Дальше →</button>'; }
function trainerHTML(){
  if (T.finished) return resultHTML();
  var n = T.qs.length, q = T.qs[T.i], w = q.w, g = gender(w);
  var col = g ? 'var(--' + g + ')' : 'var(--c)';
  var answered = T.picked != null;
  var top = '<div class="tprog"><span>' + (T.i + 1) + ' / ' + n + '</span><div class="pbar"><i style="width:' + Math.round(T.i / n * 100) + '%"></i></div><button type="button" class="link" data-act="exit">Выйти</button></div>';
  var mid = '', bottom = '';
  if (T.mode === 'cards'){
    mid = '<div class="qcard" style="--g:' + col + '"><div class="qpic" aria-hidden="true">' + w.pic + '</div><div class="qword">' + deWordHTML(w) + '</div>' + sayBtn(w.de) +
      (T.revealed ? '<div class="reveal"><div class="wtr">' + trHTML(w.tr) + '</div><div class="qru">' + esc(w.ru) + '</div>' + plHTML(w) + '</div>' : '') + '</div>';
    bottom = T.revealed
      ? '<div class="duo"><button type="button" class="btn" data-act="learn">Ещё учу</button><button type="button" class="btn pri" data-act="know">Знаю ✓</button></div>'
      : '<button type="button" class="btn pri wide" data-act="reveal">Показать перевод</button>';
  } else if (T.mode === 'art'){
    mid = '<div class="qcard" style="--g:' + (answered ? col : 'var(--c)') + '"><div class="qpic" aria-hidden="true">' + w.pic + '</div><div class="qword">' +
      (answered ? deWordHTML(w) : '<span class="noun">___ ' + esc(stripArt(w.de)) + '</span>') + '</div><div class="qhint">' + esc(w.ru) + '</div>' +
      (answered ? '<div class="wtr">' + trHTML(w.tr) + '</div>' + plHTML(w) : '') + '</div>';
    bottom = '<div class="arts">' + q.opts.map(function(o, i){
      var st = answered ? (i === q.c ? ' ok' : (i === T.picked ? ' bad' : '')) : '';
      return '<button type="button" class="artbtn a-' + o + st + '" data-act="ans" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' + o + '</button>';
    }).join('') + '</div>' + (answered && T.picked !== q.c ? nextBtn() : '');
  } else {
    var prompt = q.dir === 'de'
      ? '<div class="qword">' + deWordHTML(w) + '</div>' + sayBtn(w.de) + '<div class="qhint">Как это по-русски?</div>'
      : '<div class="qword">' + esc(w.ru) + '</div><div class="qhint">Как это по-немецки?</div>';
    mid = '<div class="qcard" style="--g:' + col + '"><div class="qpic" aria-hidden="true">' + w.pic + '</div>' + prompt + (answered ? '<div class="wtr">' + trHTML(w.tr) + '</div>' : '') + '</div>';
    bottom = '<div class="opts">' + q.opts.map(function(o, i){
      var st = answered ? (i === q.c ? ' ok' : (i === T.picked ? ' bad' : '')) : '';
      return '<button type="button" class="opt' + st + '" data-act="ans" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('') + '</div>' + (answered && T.picked !== q.c ? nextBtn() : '');
  }
  return '<div class="trainer">' + top + mid + bottom + '</div>';
}
function resultHTML(){
  var n = T.qs.length, pct = T.pct, R = 54, C = 2 * Math.PI * R, off = C * (1 - pct / 100);
  var col = pct >= 70 ? 'var(--ok)' : (pct >= 40 ? 'var(--gold)' : 'var(--bad)');
  var title = pct >= 90 ? 'Ausgezeichnet!' : (pct >= 70 ? 'Gut gemacht!' : 'Weiter so!');
  var sub = pct >= 90 ? 'Отлично, почти без ошибок.' : (pct >= 70 ? 'Хороший результат.' : 'Повторите слова и попробуйте ещё раз.');
  var label = (T.mode === 'cards' ? 'Знаю: ' : 'Верно: ') + T.right + ' из ' + n;
  var uniqWrong = {}; T.wrong.forEach(function(w){ uniqWrong[w.k] = w; });
  var nw = Object.keys(uniqWrong).length;
  var doneNote = (typeof T.origin === 'number' && T.mode !== 'cards' && pct >= 70) ? '<p class="okline">✓ Урок отмечен как пройденный</p>' : '';
  return '<div class="result"><svg class="ring" viewBox="0 0 140 140" role="img" aria-label="Результат ' + pct + '%">' +
    '<circle cx="70" cy="70" r="' + R + '" style="fill:none;stroke:var(--s2);stroke-width:12"/>' +
    '<circle cx="70" cy="70" r="' + R + '" transform="rotate(-90 70 70)" style="fill:none;stroke:' + col + ';stroke-width:12;stroke-linecap:round;stroke-dasharray:' + C.toFixed(1) + ';stroke-dashoffset:' + off.toFixed(1) + '"/>' +
    '<text x="70" y="79" text-anchor="middle" style="fill:var(--fg);font-family:var(--f-display);font-weight:800;font-size:26px">' + pct + '%</text></svg>' +
    '<h3>' + title + '</h3><p>' + sub + ' ' + label + '.</p>' + doneNote +
    '<div class="rbtns"><button type="button" class="btn pri" data-act="again">Ещё раз</button>' +
    (nw ? '<button type="button" class="btn" data-act="retry">Повторить ошибки · ' + nw + '</button>' : '') +
    '<button type="button" class="btn" data-act="exit">' + (curD === 'hard' ? 'К списку' : 'К уроку') + '</button></div></div>';
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var sb = e.target.closest('button[data-say]');
  if (sb){ say(sb.getAttribute('data-say')); sb.classList.remove('on'); void sb.offsetWidth; sb.classList.add('on'); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'tab'){ stopAll(); if (T) clearTimeout(T.timer); T = null; tab = b.getAttribute('data-tab'); repaintLesson(); }
  else if (a === 'star'){
    var k = b.getAttribute('data-k'), on = !isHard(k); setHard(k, on);
    if (curD === 'hard' && !T){ paintBody(); }
    else { b.setAttribute('aria-pressed', on); b.textContent = on ? '★' : '☆'; b.setAttribute('aria-label', on ? 'Убрать из трудных' : 'В трудные слова'); }
  }
  else if (a === 'playall'){ playAll(b); }
  else if (a === 'slow'){ slow = !slow; lsSet(LS_SLOW, slow ? '1' : '0'); b.setAttribute('aria-pressed', slow); }
  else if (a === 'start'){ startTrainer(b.getAttribute('data-mode'), deckFor(b.getAttribute('data-mode'))); }
  else if (a === 'ans'){ answer(+b.getAttribute('data-i')); }
  else if (a === 'next'){ nextQ(); }
  else if (a === 'reveal'){ T.revealed = true; say(T.qs[T.i].w.de); paintBody(); }
  else if (a === 'know' || a === 'learn'){ cardAnswer(a === 'know'); }
  else if (a === 'again'){ startTrainer(T.mode, deckFor(T.mode)); }
  else if (a === 'retry'){ var m = {}; T.wrong.forEach(function(w){ m[w.k] = w; }); startTrainer(T.mode, shuffle(Object.keys(m).map(function(x){ return m[x]; }))); }
  else if (a === 'exit'){ if (T) clearTimeout(T.timer); T = null; repaintLesson(); }
  else if (a === 'done'){ if (S.done[curD]) delete S.done[curD]; else S.done[curD] = true; save(); repaintLesson(); }
});
window.addEventListener('hashchange', function(){ stopAll(); if (T) clearTimeout(T.timer); T = null; render(); window.scrollTo(0, 0); });

render();
initCloud();
setTimeout(function(){ if (CAN){ pickVoice(); var v = document.getElementById('vnote'); if (v) v.innerHTML = voiceNote(); } }, 1500);
})();
</script>

/* установка на телефон: хранит приложение, чтобы уроки открывались без интернета */
if ("serviceWorker" in navigator && /github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
